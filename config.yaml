project:
  name: Factor_AutoResearch
  random_seed: 42

paths:
  raw_data_dir: data
  processed_data_dir: artifacts/processed
  experiment_dir: artifacts/experiments
  freeze_dir: artifacts/frozen
  output_dir: outputs
  research_panel_file: research_2010_2015.parquet
  holdout_panel_file: holdout_2016.parquet

data:
  prices_file: prices-split-adjusted.csv
  unadjusted_prices_file: prices.csv
  fundamentals_file: fundamentals.csv
  news_files:
    - analyst_ratings_processed.csv
    - raw_partner_headlines.csv
  audit_only_news_file: raw_analyst_ratings.csv
  securities_file: securities.csv
  fundamental_reporting_lag_days: 90
  news_availability_lag_days: 1
  news_chunksize: 250000
  signal_cutoff_time: "16:00:00"

universe:
  start_date: 2010-01-01
  end_date: 2016-12-31
  minimum_price: 5.0
  minimum_history_days: 60
  require_security_master_match: true

walk_forward:
  research_end_year: 2015
  folds:
    - name: validate_2013
      train_start: 2010-01-01
      train_end: 2012-12-31
      validation_start: 2013-01-01
      validation_end: 2013-12-31
    - name: validate_2014
      train_start: 2010-01-01
      train_end: 2013-12-31
      validation_start: 2014-01-01
      validation_end: 2014-12-31
    - name: validate_2015
      train_start: 2010-01-01
      train_end: 2014-12-31
      validation_start: 2015-01-01
      validation_end: 2015-12-31
  holdout_year: 2016

evaluation:
  prediction_horizon_days: 5
  ic_horizons_days: [1, 5, 10]
  newey_west_lags: auto
  portfolio_horizon_days: 1
  portfolio_quantile: 0.20
  quantile_count: 5
  transaction_cost_bps: 10.0
  high_cost_bps: 25.0
  annualization_days: 252

search:
  generations: 4
  max_candidates: 200
  max_mutations_per_parent: 3
  max_llm_proposals_per_parent: 3

# XALPHA-inspired V1 controller. These thresholds are research-only and must
# never be changed after inspecting the 2016 final holdout.
adaptive_research:
  max_rounds: 24
  max_candidate_evaluations: 60
  stop_rounds_without_improvement: 2
  minimum_evidence_before_stop: 60
  minimum_mechanisms_before_stop: 8
  min_candidates_per_mechanism: 2
  pivot_failure_threshold: 3
  combine_max_parent_correlation: 0.50
  parent_pool_size: 20
  elite_archive_size: 12
  dynamic_leakage_enabled: true
  dynamic_leakage_sample_tickers: 4
  dynamic_leakage_cutoffs: 2
  budgets:
    improve: 4
    combine: 3
    pivot: 6
  parent_min_mean_ic: 0.0
  parent_min_positive_folds: 1
  parent_max_turnover: 2.0
  elite_min_mean_ic: 0.005
  elite_min_tstat: 1.0
  elite_min_positive_folds: 3
  elite_min_high_cost_sharpe: 0.0
  elite_max_turnover: 1.5
  final_correlation_threshold: 0.70
  min_incremental_ic: 0.001
  max_final_factors: 8

llm:
  enabled: true
  required: false
  provider: openai
  endpoint: responses
  model: gpt-5.6-luna
  model_env: OPENAI_FACTOR_MODEL
  api_key_env: OPENAI_API_KEY
  reasoning_mode: standard
  reasoning_effort: low
  verbosity: low
  max_output_tokens: 6000
  store: false
  prompt_cache_key: factor-autoresearch-v1
  max_history_records: 20
  max_proposals_per_generation: 6
  allowed_windows: [1, 5, 10, 20, 60]

gates:
  min_mean_ic: 0.0
  min_ic_tstat: 1.0
  min_positive_ic_folds: 2
  min_net_sharpe: 0.0
  min_high_cost_sharpe: 0.0
  max_daily_turnover: 1.5
  max_fold_drawdown: -0.30
  max_complexity: 4
  minimum_factor_coverage: 0.20
  redundancy_correlation: 0.85
  min_incremental_ic: 0.001
